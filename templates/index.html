<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Downloader</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <style>
        body {
            background-color: #212529;
        }

        .container {
            max-width: 800px;
        }

        #preview-card, #progress-container {
            display: none;
        }

        #loading-spinner {
            display: none;
        }

        .progress-bar {
            transition: width 0.3s ease;
        }

        /* Estilo para a lista de downloads (CORRIGIDO) */
        /* Mudei de '.download-item img' para 'img.download-item' */
        img.download-item {
            display: block;
            width: 120px; /* Largura fixa */
            height: 90px; /* Altura fixa */
            object-fit: cover; /* Garante que a imagem cubra a area sem distorcer */
            border-radius: 0.25rem;
            flex-shrink: 0; /* Impede que a imagem encolha */
        }
    </style>
</head>
<body class="py-5">
    <div class="container">
        <div class="text-center mb-4">
            <h1 class="display-5">📥 YouTube Downloader</h1>
            <p class="lead text-body-secondary">Cole um link do YouTube para baixar</p>
        </div>

        <div class="input-group mb-3 shadow-sm">
            <input type="text" id="url-input" class="form-control form-control-lg" placeholder="https://www.youtube.com/watch?v=...">
            <button class="btn btn-primary" id="check-btn" type="button">
                <span id="loading-spinner" class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                Verificar
            </button>
        </div>
        <div id="status-message" class="text-center mt-3"></div>

        <div class="card shadow-sm mt-4" id="preview-card">
            <div class="row g-0">
                <div class="col-md-4">
                    <img id="preview-thumbnail" src="" class="img-fluid rounded-start" alt="Thumbnail">
                </div>
                <div class="col-md-8">
                    <div class="card-body">
                        <h5 class="card-title" id="preview-title">Título do Vídeo</h5>
                        <hr>
                        <p>Selecione o formato:</p>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="format" id="format-mp4" value="mp4" checked>
                            <label class="form-check-label" for="format-mp4">Vídeo (MP4)</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="format" id="format-mp3" value="mp3">
                            <label class="form-check-label" for="format-mp3">Somente Áudio (Audio)</label>
                        </div>
                        <button class="btn btn-success mt-3 w-100" id="download-btn">
                            Baixar
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="mt-4" id="progress-container">
            <p class="text-center mb-1" id="progress-text">Baixando...</p>
            <div class="progress" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
                <div class="progress-bar progress-bar-striped progress-bar-animated" id="progress-bar" style="width: 0%">0%</div>
            </div>
        </div>

        <div class="mt-5">
            <h3 class="border-bottom pb-2">Arquivos Baixados</h3>
            <div class="list-group" id="download-list">
            </div>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

    <script>
        // Conecta ao Socket.IO (NOVO)
        const socket = io();

        // Seletores de elementos
        const urlInput = document.getElementById('url-input');
        const checkBtn = document.getElementById('check-btn');
        const loadingSpinner = document.getElementById('loading-spinner');
        const statusMessage = document.getElementById('status-message');

        // Preview Card
        const previewCard = document.getElementById('preview-card');
        const previewThumbnail = document.getElementById('preview-thumbnail');
        const previewTitle = document.getElementById('preview-title');
        const downloadBtn = document.getElementById('download-btn');
        const radioMp4 = document.getElementById('format-mp4');
        const radioMp3 = document.getElementById('format-mp3');

        // Progresso (NOVO)
        const progressContainer = document.getElementById('progress-container');
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');

        // Lista de Downloads
        const downloadList = document.getElementById('download-list');

        let currentUrl = ''; // Armazena a URL verificada

        // --- FUNCOES ---

        // Funcao para mostrar mensagens de status/erro
        function showStatus(message, isError = false) {
            statusMessage.innerHTML = message;
            statusMessage.className = isError ? 'alert alert-danger' : 'alert alert-success';
        }

        // 1. Verificar Video (Preview) - Sem mudancas, apenas no 'catch'
        async function checkVideo() {
            const url = urlInput.value;
            if (!url) {
                showStatus("Por favor, insira uma URL.", true);
                return;
            }

            checkBtn.disabled = true;
            loadingSpinner.style.display = 'inline-block';
            statusMessage.innerHTML = '';
            previewCard.style.display = 'none';

            try {
                const response = await fetch('/get_video_info', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || 'Erro do servidor');
                }

                const data = await response.json();

                previewTitle.textContent = data.title;
                previewThumbnail.src = data.thumbnail_url;
                currentUrl = url;

                radioMp4.disabled = !data.has_video;
                radioMp3.disabled = !data.has_audio;
                if (data.has_video) radioMp4.checked = true;
                else if (data.has_audio) radioMp3.checked = true;

                previewCard.style.display = 'flex';

            } catch (error) {
                showStatus(`Erro ao verificar: ${error.message}`, true);
            } finally {
                checkBtn.disabled = false;
                loadingSpinner.style.display = 'none';
            }
        }

        // 2. Iniciar o Download (MUDOU COMPLETAMENTE)
        function startDownload() {
            const format = document.querySelector('input[name="format"]:checked').value;

            // Desabilita o card e mostra a barra de progresso
            previewCard.style.display = 'none';
            downloadBtn.disabled = true; // Desabilita o botao

            showStatus("Iniciando download...", false);
            progressText.textContent = "Iniciando...";
            progressBar.style.width = '0%';
            progressBar.textContent = '0%';
            progressContainer.style.display = 'block';

            // Emite o evento para o servidor (NOVO)
            socket.emit('start_download', {
                url: currentUrl,
                format: format
            });
        }

        // 3. Carregar Lista de Arquivos (MUDOU COMPLETAMENTE)
        async function loadDownloadedFiles() {
            try {
                const response = await fetch('/get_downloads');
                const data = await response.json();

                downloadList.innerHTML = ''; // Limpa a lista atual

                if (data.files && data.files.length > 0) {
                    // Inverte a lista para mostrar os mais novos primeiro
                    data.files.reverse().forEach(file => {
                        // Cria o item da lista com thumbnail e botao
                        const itemHTML = `
                                <a href="/downloads/${file.filename}" target="_blank" class="list-group-item list-group-item-action d-flex align-items-center">
                                    <img src="${file.thumbnail}" alt="Thumbnail" class="me-4 download-item img">
                                    <div class="flex-fill">
                                        <h6 class="mb-0">${file.title}</h6>
                                        <small class="text-body-secondary">${file.filename}</small>
                                    </div>
                                    <button class="btn btn-outline-primary ms-3">Visualizar</button>
                                </a>
                            `;
                        downloadList.innerHTML += itemHTML;
                    });
                } else {
                    downloadList.innerHTML = '<div class="list-group-item text-body-secondary">Nenhum arquivo baixado ainda.</div>';
                }
            } catch (error) {
                downloadList.innerHTML = `<div class="list-group-item text-danger">Erro ao carregar arquivos: ${error.message}</div>`;
            }
        }

        // --- EVENT LISTENERS (Socket.IO) ---

        // Ouve o progresso do download (NOVO)
        socket.on('download_progress', (data) => {
            const percent = data.percent.toFixed(0);
            progressBar.style.width = `${percent}%`;
            progressBar.textContent = `${percent}%`;
            progressText.textContent = "Baixando...";
        });

        // Ouve a finalizacao do download (NOVO)
        socket.on('download_finished', (data) => {
            showStatus(data.message, false);
            progressContainer.style.display = 'none'; // Esconde o progresso
            downloadBtn.disabled = false; // Re-habilita

            // Limpa o input e atualiza a lista
            urlInput.value = '';
            currentUrl = '';
            loadDownloadedFiles(); // <-- ATUALIZA A LISTA
        });

        // Ouve por erros do download (NOVO)
        socket.on('download_error', (data) => {
            showStatus(`Erro no download: ${data.error}`, true);
            progressContainer.style.display = 'none'; // Esconde o progresso
            downloadBtn.disabled = false; // Re-habilita
        });


        // --- EVENT LISTENERS (Pagina) ---
        urlInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') checkVideo();
        });

        checkBtn.addEventListener('click', checkVideo);
        downloadBtn.addEventListener('click', startDownload); // <-- MUDOU

        // Carrega a lista de arquivos ao iniciar a pagina
        document.addEventListener('DOMContentLoaded', loadDownloadedFiles);

    </script>
</body>
</html>
